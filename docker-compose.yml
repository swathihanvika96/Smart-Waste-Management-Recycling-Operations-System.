services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waste
      POSTGRES_PASSWORD: waste
      POSTGRES_DB: waste
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine          # optional - only needed if you wire REDIS_URL
    profiles: ["redis"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://waste:waste@db:5432/waste
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
